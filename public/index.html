<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Five residents. One small world. A few things out of place.">
  <title>monki world</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./playground.css">
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Monki world home"><canvas id="brand-monki" width="48" height="48" aria-hidden="true"></canvas><span>monki<span class="brand-bottom">world<span class="brand-dot">.</span></span></span></a>
      <div class="header-right"><div class="status"><span id="status-dot"></span><span id="connection">a little world</span></div><button id="sound" class="icon-button" title="Turn sound on" aria-label="Turn sound on"></button><button id="settings" class="icon-button" title="Settings" aria-label="Settings"></button></div>
    </header>
    <main>
      <section class="story-card" aria-label="A little adventure">
        <canvas id="story-art" width="105" height="90" aria-hidden="true"></canvas>
        <div class="story-copy"><span class="eyebrow" id="story-kicker">A LITTLE ADVENTURE</span><h1 id="story-title">Monki is leaving.</h1><p id="story-subtitle">The balloons were a bad idea.</p></div>
        <button id="start-adventure" class="play-button">Play <span aria-hidden="true">→</span></button>
      </section>
      <section class="game-card" aria-label="Your shared world">
        <div class="scene-bar"><div class="place-tabs" id="locations"></div><button class="small-action" id="together"><span id="together-icon"></span><span>Us two</span></button></div>
        <div class="scene-wrap" id="scene-wrap">
          <canvas id="world" width="400" height="336" tabindex="0" aria-label="House with David, Julia, Monki, Sernik and Galgan. Tap to interact, drag to move. Use the resident buttons below for keyboard access."></canvas>
          <div class="scene-tip" id="scene-tip"></div>
          <div class="interaction-menu" id="interaction-menu" hidden></div>
        </div>
        <div class="scene-footer"><div class="residents" id="residents" aria-label="Residents"></div><span class="room-help">Hold + drag to move</span></div>
      </section>
      <section class="toy-bar" aria-label="Play in the room"><button id="play-ball"><canvas width="40" height="40" id="ball-art" aria-hidden="true"></canvas><span>Unroll the paper</span></button><button id="play-bubbles"><canvas width="40" height="40" id="bubble-art" aria-hidden="true"></canvas><span>Blow bubbles</span></button><button id="tidy-room"><span id="tidy-icon"></span><span>Put things away</span></button></section>
      <section class="below-world">
        <div class="pocket-section"><div class="pocket" id="pocket"></div></div>
        <div class="left-behind"><button id="last-trace" class="trace-card" aria-label="See what happened"><span class="trace-image" id="trace-image"></span><span id="trace-label"></span><span class="trace-arrow">→</span></button></div>
      </section>
      <nav class="bottom-note" aria-label="Things to do"><button id="wardrobe" class="footer-button"></button><button id="draw" class="footer-button"></button><button id="surprise" class="footer-button"></button><button id="history" class="footer-button"></button></nav>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet"><div class="sheet-top"><span class="eyebrow" id="sheet-eyebrow">MONKI WORLD</span><button id="close-sheet" class="icon-button" aria-label="Close"></button></div><div id="sheet-body"></div></dialog>
  <dialog id="microgame"><div class="microgame-top"><button id="leave-game" class="icon-button" aria-label="Back to the house"></button><div><span id="game-chapter"></span><h2 id="game-title"></h2></div><button id="pause-game" class="icon-button" aria-label="Pause"></button></div><div class="game-canvas-wrap"><canvas id="micro" width="400" height="430" tabindex="0" aria-label="Interactive adventure"></canvas><button id="resume-game" class="primary-button" hidden>Resume</button></div><div class="microgame-bottom"><span id="game-hint"></span><span id="game-progress"></span></div><div id="game-steps" class="chapter-steps" aria-label="Adventure progress"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
