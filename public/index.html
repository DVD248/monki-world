<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Five residents. One small world. A few things out of place.">
  <title>monki world</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Monki world home"><canvas id="brand-monki" width="48" height="48" aria-hidden="true"></canvas><span>monki<span class="brand-bottom">world<span class="brand-dot">.</span></span></span></a>
      <div class="header-right"><div class="status"><span id="status-dot"></span><span id="connection">a little world</span></div><button id="sound" class="icon-button" title="Turn sound on" aria-label="Turn sound on"></button><button id="settings" class="icon-button" title="Settings" aria-label="Settings"></button></div>
    </header>
    <main>
      <section class="game-card" aria-label="Your shared world">
        <div class="scene-bar"><div class="place-tabs" id="locations"></div><button class="small-action" id="together"><span id="together-icon"></span><span>Us two</span></button></div>
        <div class="scene-wrap" id="scene-wrap">
          <canvas id="world" width="400" height="336" tabindex="0" aria-label="House with David, Julia, Monki, Sernik and Galgan. Tap to interact, drag to move. Use the resident buttons below for keyboard access."></canvas>
          <div class="scene-tip" id="scene-tip"></div>
          <div class="interaction-menu" id="interaction-menu" hidden></div>
        </div>
        <div class="scene-footer"><div class="residents" id="residents" aria-label="Residents"></div></div>
      </section>
      <section class="below-world">
        <div class="pocket-section"><div class="pocket" id="pocket"></div></div>
        <div class="left-behind"><button id="last-trace" class="trace-card" aria-label="What happened here"><span class="trace-image" id="trace-image"></span><span id="trace-label"></span></button></div>
      </section>
      <footer class="bottom-note"><button id="draw" class="footer-button" aria-label="Draw something">✎</button><button id="history" class="footer-button" aria-label="What happened here">◷</button><button id="surprise" class="footer-button" aria-label="Leave a surprise">✳</button></footer>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet"><div class="sheet-top"><span class="eyebrow" id="sheet-eyebrow">MONKI WORLD</span><button id="close-sheet" class="icon-button" aria-label="Close"></button></div><div id="sheet-body"></div></dialog>
  <dialog id="microgame"><div class="microgame-top"><button id="leave-game" class="icon-button" aria-label="Leave"></button><span id="game-modifier"></span><button id="pause-game" class="icon-button" aria-label="Pause"></button></div><div class="game-canvas-wrap"><canvas id="micro" width="400" height="420" tabindex="0" aria-label="Short game"></canvas><button id="resume-game" class="primary-button" hidden>Resume</button></div><div class="microgame-bottom"><span id="game-progress" class="pips" aria-hidden="true"></span></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
